<dialog id="modal_cours_series_scope" class="modal" tabindex="-1">
    <div class="modal-box p-5 w-[96%] max-w-lg rounded-2xl border border-slate-200 shadow-2xl">
        <h3 class="font-black text-xs mb-2 uppercase text-slate-500 border-b pb-2 tracking-widest">Modifier la série</h3>
        <p class="text-[11px] text-slate-600 mb-3 leading-snug">
            Ce créneau fait partie d'une série périodique. Comme sur Google Agenda, choisissez la portée de la modification.
        </p>
        <div class="space-y-2 text-[11px] text-slate-800">
            <label class="flex gap-2 items-start cursor-pointer">
                <input type="radio" name="cours-series-scope" value="single" class="mt-0.5" checked />
                <span
                    ><strong>Ce créneau uniquement</strong> — exception locale : les autres occurrences de la série
                    restent inchangées ; seule cette occurrence est modifiée.</span
                >
            </label>
            <label class="flex gap-2 items-start cursor-pointer">
                <input type="radio" name="cours-series-scope" value="future" class="mt-0.5" />
                <span
                    ><strong>Ce créneau et les suivants</strong> — la série est coupée à partir de cette occurrence,
                    puis recréée avec vos changements pour toute la suite.</span
                >
            </label>
            <label class="flex gap-2 items-start cursor-pointer">
                <input type="radio" name="cours-series-scope" value="all" class="mt-0.5" />
                <span
                    ><strong>Toute la série</strong> — toutes les occurrences de cette série sont réalignées avec vos
                    changements.</span
                >
            </label>
        </div>
        <div class="modal-action mt-4 pt-3 border-t border-slate-100 flex justify-end gap-2">
            <button type="button" id="cours-series-scope-cancel" class="btn btn-ghost btn-sm font-black text-[11px]">
                Fermer
            </button>
            <button type="button" id="cours-series-scope-ok" class="btn btn-primary btn-sm font-black text-[11px]">
                Continuer
            </button>
        </div>
    </div>
</dialog>
