<dialog id="modal_reservation" class="modal">
    <div class="modal-box reservation-route-box p-4 w-[96%] max-w-md max-h-[90dvh] flex flex-col border-0 shadow-none">
        <div id="wrap-reservation-body" class="space-y-4 overflow-y-auto flex-1 min-w-0 py-1">
            <div id="wrap-reservation-info" class="hidden" aria-hidden="true"></div>
            <div id="wrap-reservation-readonly" class="hidden" aria-hidden="true"></div>
            <div id="wrap-reservation-editor" class="space-y-4 reservation-editor-simple relative">
                <h2 id="reservation-modal-headline" class="reservation-modal-headline hidden text-sm font-bold text-slate-900 dark:text-slate-100 m-0 leading-snug" aria-live="polite"></h2>
                <hr id="reservation-modal-headline-divider" class="reservation-modal-headline-divider hidden" aria-hidden="true" />

                <label class="form-control block" for="event-date-display-label">
                    <span class="label-text font-bold text-[11px] uppercase text-slate-500 py-0">Jour</span>
                    <div class="flex items-center gap-2 mt-0.5 min-w-0">
                        <input type="text" id="event-date-display-label" class="planning-field input input-bordered input-sm flex-1 min-w-0 text-sm" readonly />
                        <input type="date" id="event-date-start" class="sr-only" tabindex="-1" aria-hidden="true" />
                        <button type="button" id="event-date-picker-btn" class="btn btn-sm btn-square planning-btn-accent shrink-0" title="Choisir une date" aria-label="Ouvrir le calendrier">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5a2.25 2.25 0 002.25-2.25m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5a2.25 2.25 0 012.25 2.25v7.5m-15 0h3.75m9 0H18" /></svg>
                        </button>
                    </div>
                </label>

                <div class="form-control">
                    <span class="label-text font-bold text-[11px] uppercase text-slate-500 block mb-1">Horaires</span>
                    <div class="flex flex-wrap items-center gap-2">
                        <select id="event-start" aria-label="Heure de début" class="select select-sm w-[6.5rem] font-mono bg-white dark:bg-slate-900"></select>
                        <span class="text-slate-500 text-sm">à</span>
                        <select id="event-end" aria-label="Heure de fin" class="select select-sm w-[6.5rem] font-mono bg-white dark:bg-slate-900"></select>
                    </div>
                    <input type="hidden" id="event-date-display" />
                </div>

                <div id="wrap-reservation-motif" class="form-control">
                    <span class="label-text font-bold text-[11px] uppercase text-slate-500 block mb-1">Motif</span>
                    <p id="event-motif-hint-fermeture" class="hidden" aria-hidden="true"></p>
                    <select id="event-motif-select" class="planning-field select select-sm select-bordered w-full" aria-label="Motif"></select>
                </div>

                <div id="wrap-reservation-title" class="form-control">
                    <label class="label py-0" for="event-title-input"><span class="label-text font-bold text-[11px] uppercase text-slate-500">Titre</span></label>
                    <input id="event-title-input" type="text" maxlength="120" class="input input-sm w-full bg-white dark:bg-slate-900" />
                </div>

                <div id="event-recurring-wrap" class="hidden" aria-hidden="true"></div>
                <div id="wrap-reservation-inscrits" class="hidden form-control" aria-hidden="true">
                    <span class="label-text font-bold text-[11px] uppercase text-slate-500 py-0">Élèves inscrits</span>
                    <p id="reservation-inscrits-summary" class="text-sm text-slate-700 dark:text-slate-200 mt-1 mb-2 leading-snug">Aucun élève (optionnel)</p>
                    <button type="button" id="event-inscrits-users-toggle" class="btn btn-outline btn-sm font-bold text-[11px] w-full sm:w-auto">Gérer les inscrits</button>
                    <select id="event-inscrits-select" multiple class="hidden"></select>
                </div>
                <p id="event-editor-owner" class="hidden" aria-hidden="true"></p>

                <div id="reservation-modal-footer" class="hidden reservation-modal-footer pt-3 mt-1 border-t border-slate-200 dark:border-slate-600" aria-hidden="true">
                    <div id="reservation-delete-wrap" class="hidden shrink-0">
                        <button type="button" id="btn-delete" class="btn btn-error btn-outline btn-sm font-bold text-[11px]">Supprimer</button>
                    </div>
                    <div id="reservation-form-actions" class="reservation-form-actions flex flex-wrap items-center justify-end gap-2 min-w-0 flex-1">
                        <button type="button" id="btn-reservation-cancel" class="btn btn-ghost btn-sm font-bold text-[11px]">Annuler</button>
                        <button type="button" id="btn-reservation-save" class="btn btn-primary btn-sm font-bold text-[11px]">Sauver</button>
                    </div>
                    <button type="button" id="btn-reservation-edit-fermeture" class="btn btn-outline btn-sm font-bold text-[11px] hidden shrink-0">Modifier</button>
                    <button type="button" id="btn-reservation-close" class="btn btn-ghost btn-sm font-bold text-[11px] hidden shrink-0 ml-auto">Fermer</button>
                </div>
            </div>
        </div>

        <div class="reservation-route-actions hidden" aria-hidden="true">
            <button type="button" id="btn-save" class="hidden" aria-hidden="true">Enregistrer</button>
        </div>
    </div>
</dialog>
