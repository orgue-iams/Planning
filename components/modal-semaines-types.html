<dialog id="modal_semaines_types" class="modal modal-semaines-types">
    <div class="modal-box semaines-types-modal-box flex flex-col w-full max-w-none h-full max-h-none min-h-0 rounded-none p-0 border-0 shadow-none bg-slate-50">
        <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden px-4 sm:px-6 py-4">
            <div class="max-w-[1600px] mx-auto w-full">

                <div id="st-main-panel" class="st-main-panel-stack">
                    <p id="st-tap-hint" class="st-swipe-hint text-[10px] text-slate-600 dark:text-slate-300 m-0 mb-2 leading-snug">
                        Appuyez sur un créneau pour le modifier ou le supprimer.
                    </p>
                    <section id="st-teaching-days-section" class="st-section hidden" aria-hidden="true" hidden>
                        <p id="st-teaching-days-title" class="st-section-title">Mes jours d’enseignement</p>
                        <p class="text-[9px] text-slate-500 dark:text-slate-400 m-0 mb-2 leading-snug">
                            Le gabarit ne porte que sur ces journées (journée entière). Modifiable à tout moment.
                        </p>
                        <div class="flex flex-wrap gap-x-3 gap-y-1.5 text-[11px] font-medium" id="st-teaching-days-checkboxes">
                            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="checkbox checkbox-xs st-teaching-day-cb" value="1" /> Lun</label>
                            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="checkbox checkbox-xs st-teaching-day-cb" value="2" /> Mar</label>
                            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="checkbox checkbox-xs st-teaching-day-cb" value="3" /> Mer</label>
                            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="checkbox checkbox-xs st-teaching-day-cb" value="4" /> Jeu</label>
                            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="checkbox checkbox-xs st-teaching-day-cb" value="5" /> Ven</label>
                            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="checkbox checkbox-xs st-teaching-day-cb" value="6" /> Sam</label>
                            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="checkbox checkbox-xs st-teaching-day-cb" value="7" /> Dim</label>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 mt-2">
                            <button type="button" id="st-teaching-days-save" class="btn btn-sm planning-btn-accent font-semibold text-[10px]">Enregistrer mes jours</button>
                            <p id="st-teaching-days-hint" class="text-[9px] text-slate-500 m-0 hidden" role="status"></p>
                        </div>
                    </section>
                    <section id="st-gabarit-section" class="st-section">
                        <p id="st-gabarit-prof-title" class="st-section-title hidden">Mon gabarit</p>
                        <div class="st-section-split">
                            <div class="st-section-col">
                                <div class="st-section-col-head">
                                    <span class="font-bold text-slate-700 dark:text-slate-200">Semaine A</span>
                                    <button type="button" id="st-add-row-a" class="btn btn-sm planning-btn-accent font-semibold text-[10px] hidden">+ Créneau</button>
                                </div>
                                <div id="st-list-a" class="st-slot-list"></div>
                            </div>
                            <div class="st-section-col">
                                <div class="st-section-col-head">
                                    <span class="font-bold text-slate-700 dark:text-slate-200">Semaine B</span>
                                    <button type="button" id="st-add-row-b" class="btn btn-sm planning-btn-accent font-semibold text-[10px] hidden">+ Créneau</button>
                                </div>
                                <div id="st-list-b" class="st-slot-list"></div>
                            </div>
                        </div>
                    </section>

                    <section id="st-actions-section" class="st-section">
                        <div class="st-actions-row flex flex-col sm:flex-row flex-wrap gap-2">
                            <button
                                type="button"
                                id="st-open-apply-modal"
                                class="btn btn-sm planning-btn-accent font-semibold text-[11px] flex-1 min-w-[12rem]"
                            >
                                Recréer mes créneaux depuis le gabarit
                            </button>
                            <button
                                type="button"
                                id="st-open-shift-modal"
                                class="btn btn-sm planning-btn-accent font-semibold text-[11px] flex-1 min-w-[12rem]"
                            >
                                Décaler mes créneaux existants
                            </button>
                        </div>
                    </section>
                </div>

            </div>
        </div>
    </div>
</dialog>
