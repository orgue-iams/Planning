<dialog id="modal_st_slot_edit" class="modal" tabindex="-1">
    <div class="modal-box p-5 w-[96%] max-w-lg max-h-[90dvh] rounded-2xl border border-slate-200 shadow-2xl flex flex-col dark:border-slate-600">
        <h3 id="stle-dialog-title" class="font-black text-xs mb-3 uppercase text-slate-500 border-b pb-2 tracking-widest shrink-0">Créneau semaine type</h3>
        <div class="flex-1 min-h-0 overflow-y-auto space-y-3 text-[11px] text-slate-800 dark:text-slate-100">
            <div class="st-edit-field">
                <span class="st-edit-label">Type</span>
                <div class="flex flex-wrap gap-3 mt-1">
                    <label class="flex items-center gap-1.5 cursor-pointer font-medium">
                        <input type="radio" name="stle-slot-type" id="stle-type-cours" value="cours" class="radio radio-xs" checked />
                        Cours
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer font-medium">
                        <input type="radio" name="stle-slot-type" id="stle-type-reservation" value="reservation" class="radio radio-xs" />
                        Travail perso.
                    </label>
                </div>
            </div>
            <label class="st-edit-field block" for="stle-dow">
                <span class="st-edit-label">Jour (semaine type)</span>
                <select id="stle-dow" class="select select-bordered select-sm w-full text-[11px] bg-white dark:bg-slate-900 mt-0.5">
                    <option value="1">Lundi</option>
                    <option value="2">Mardi</option>
                    <option value="3">Mercredi</option>
                    <option value="4">Jeudi</option>
                    <option value="5">Vendredi</option>
                    <option value="6">Samedi</option>
                    <option value="7">Dimanche</option>
                </select>
            </label>
            <div class="form-control">
                <span class="st-edit-label">Horaires</span>
                <div class="flex flex-wrap items-center gap-2 mt-1">
                    <select id="stle-start" aria-label="Heure de début" class="select select-bordered select-sm w-[6.5rem] font-mono text-[11px] bg-white dark:bg-slate-900"></select>
                    <span class="text-slate-500 text-sm">à</span>
                    <select id="stle-end" aria-label="Heure de fin" class="select select-bordered select-sm w-[6.5rem] font-mono text-[11px] bg-white dark:bg-slate-900"></select>
                </div>
            </div>
            <div>
                <label class="text-[9px] font-bold text-slate-500 block mb-0.5" for="stle-title">Titre</label>
                <input type="text" id="stle-title" class="input input-bordered input-sm w-full text-[11px]" maxlength="200" />
            </div>
            <div id="stle-students-wrap" class="hidden space-y-1.5">
                <button type="button" id="stle-students-manage-btn" class="btn btn-outline btn-sm w-full font-bold text-[11px]">Gérer les inscrits</button>
                <p id="stle-students-summary" class="text-[10px] text-slate-600 dark:text-slate-300 m-0 leading-snug"></p>
            </div>
            <button type="button" id="stle-delete-btn" class="btn btn-error btn-outline btn-sm font-bold text-[11px] w-full sm:w-auto">Supprimer le créneau</button>
        </div>
        <div class="modal-action mt-3 pt-3 border-t border-slate-100 shrink-0 flex justify-end gap-2">
            <button type="button" id="stle-btn-cancel" class="btn planning-btn-dismiss btn-sm font-black text-[11px]">Fermer</button>
            <button type="button" id="stle-btn-apply" class="btn btn-primary btn-sm font-black text-[11px]">Appliquer</button>
        </div>
    </div>
</dialog>
