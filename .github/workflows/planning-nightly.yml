# Rapport nocturne (digest infra + audit miroirs Google + réparation + e-mail)
# Pipeline 3 phases — lots de réparation sans resync complet (skipResync), sous ~150 s Edge.
name: Planning nightly report

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          set -euo pipefail
          missing=
          [ -z "${{ secrets.SUPABASE_URL }}" ] && missing="$missing SUPABASE_URL"
          [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "${{ secrets.PLANNING_CRON_SECRET }}" ] && missing="$missing PLANNING_CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Run nightly pipeline (audit → repair lots → report)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PLANNING_CRON_SECRET: ${{ secrets.PLANNING_CRON_SECRET }}
          MAX_REPAIR_BATCHES: '25'
          REPAIR_BATCH_SIZE: '4'
          CURL_MAX_TIME: '140'
        run: |
          chmod +x scripts/planning-nightly-ci.sh
          ./scripts/planning-nightly-ci.sh
